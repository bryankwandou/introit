<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Introit">
  <title>Introit</title>
  <!-- Nave arch: the threshold where the introit is sung -->
  <path d="M10 57 L10 32 A22 22 0 0 1 54 32 L54 57"
        fill="none" stroke="#D4A24C" stroke-width="3.5"
        stroke-linecap="round" stroke-opacity="0.55" />
  <!-- Light: a projector throw opening upward, doubling as the I of Introit -->
  <path d="M32 57 L20.5 21 Q32 15.5 43.5 21 Z" fill="#D4A24C" />
</svg>
